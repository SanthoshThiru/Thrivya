spring.application.name=thrivya

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/thrivya}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

thrivya.upload.resume-directory=${THRIVYA_UPLOAD_DIR:uploads/resumes}

#thrivya.resources.refresh-ms=86400000

thrivya.resources.refresh-ms=60000

